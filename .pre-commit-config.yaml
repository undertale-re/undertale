repos:
-   repo: https://github.com/pappasam/toml-sort
    rev: v0.24.4
    hooks:
      - id: toml-sort
        args: [--in-place]
-   repo: https://github.com/pycqa/isort
    rev: 9.0.0a3
    hooks:
    -   id: isort
-   repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
    -   id: black
-   repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
    -   id: flake8
        language_version: python3
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
    # Avoid mypy module name collision between the main Undertale module
    # and the extra Binary Ninja plugin by running the hook separately.
    -   id: mypy
        name: mypy
        args: [--ignore-missing-imports]
        exclude: ^extras/binaryninja-plugin/
    -   id: mypy
        name: mypy (binaryninja-plugin)
        args: [--ignore-missing-imports]
        files: ^extras/binaryninja-plugin/
