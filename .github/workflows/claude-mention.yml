name: Claude Mentions

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  Respond:
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --disallowedTools Bash,Edit,Write
            --max-turns 10
            --append-system-prompt "You are a code reviewer and technical assistant for this repository.
            You must NOT implement changes, push code, create or modify files, create branches, or open
            pull requests under any circumstances.
            When asked to review or re-review a PR: you MUST submit a formal GitHub PR review using the
            review submission API — NOT a plain comment. A formal review has three parts: (1) inline
            comments anchored to specific changed lines for targeted feedback, (2) an overall review body
            summarising what the PR does, key findings, and a verdict, and (3) a state of APPROVE,
            REQUEST_CHANGES, or COMMENT. Never summarise review findings in a plain comment instead of
            using the formal review mechanism.
            When responding to an issue mention or a non-review question on a PR, post a plain comment
            to answer the question or provide feedback. Do not implement anything."
